<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />

    
  </head>
  <body>
    <section>
        
        <div class="container">
            <h1>Sign Up</h1>
            <form action="submit.php" method="POST">
                <div class="form-row">      
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" name="firstName" required />
                </div>
                <div class="form-row">
                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" name="lastName" required />
                </div>

            <div class="form-row">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required />
            </div>
            <div class="form-row">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required />
            </div>
            <div class="form-row">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" minlength='8' maxlength="16" required />
            </div>
            <div class="form-row">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" minlength='8' maxlength="16" required />
            </div>
            <button type="submit">Create Account</button>
            <h3>Already have an account? <a href="login.html">Login</a></h3>
        </form>
    </section>
  </body>
</html>
